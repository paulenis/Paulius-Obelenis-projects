<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F6B45">
<title>Pirkinių sąrašas</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme before first paint so the page never flashes the wrong colours.
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
    </span>
    <div>
      <h1>Pirkinių sąrašas</h1>
      <div class="sync" id="sync-state">Jungiamasi…</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="chips" id="chain-chips" aria-label="Kainų duomenų būsena"></div>
    <button type="button" class="btn ghost" id="collect-btn">Atnaujinti kainas</button>
    <button type="button" class="icon-btn" id="theme-btn" aria-label="Keisti spalvų režimą">
      <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" aria-label="Skiltys">
  <button type="button" class="tab" data-tab="list" id="tab-list">Sąrašas</button>
  <button type="button" class="tab" data-tab="search" id="tab-search">Pridėti prekę</button>
</nav>

<div class="layout" id="layout">
  <main class="panel search-panel" id="search-panel">
    <form class="search" id="search-form" autocomplete="off">
      <label for="q">Ieškoti prekės visuose tinkluose</label>
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="pvz. sviestas 82" enterkeyhint="search">
      </div>
    </form>
    <div id="results" class="results" aria-live="polite"></div>
  </main>

  <aside class="panel list-panel" id="list-panel">
    <div class="list-head">
      <h2>Mano sąrašas</h2>
      <span class="muted" id="list-count"></span>
    </div>
    <div id="list"></div>
    <div class="list-foot">
      <div>
        <div class="muted small">Liko nupirkti</div>
        <div class="total" id="left-total">0,00 €</div>
      </div>
      <button type="button" class="btn ghost" id="clear-done">Išvalyti nupirktas</button>
    </div>
  </aside>
</div>

<dialog id="name-dialog">
  <form method="dialog" id="name-form">
    <h2>Kaip jus vadinti?</h2>
    <p class="muted">Vardas rodomas prie prekių, kurias įdedate į bendrą sąrašą.</p>
    <label for="name-input">Vardas</label>
    <input id="name-input" required maxlength="30">
    <button type="submit" class="btn primary">Išsaugoti</button>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
